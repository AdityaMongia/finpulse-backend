# ==============================================================================
# FinPulse — Docker Compose
# Spins up a dedicated PostgreSQL instance on port 5434
# (avoids conflicts with any existing postgres on the default 5432)
#
# Usage:
#   docker compose up -d          ← start in background
#   docker compose down           ← stop
#   docker compose down -v        ← stop + delete all data (full reset)
#   docker compose logs -f db     ← tail postgres logs
# ==============================================================================

version: "3.9"

services:
  db:
    image: postgres:16-alpine # lightweight, LTS postgres image
    container_name: finpulse_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: finpulse_secret
      POSTGRES_DB: finpulse_db

    ports:
      - "5434:5432" # host:5434 → container:5432

    volumes:
      - finpulse_pg_data:/var/lib/postgresql/data # persist data across restarts

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finpulse -d finpulse_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  finpulse_pg_data:
    driver: local
