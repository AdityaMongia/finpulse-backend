# alembic.ini
# ============
# Alembic configuration file for FinPulse database migrations.
#
# Commands:
#   alembic revision --autogenerate -m "your message"  -> generate migration
#   alembic upgrade head                               -> apply all migrations
#   alembic downgrade -1                               -> roll back one step
#   alembic history                                    -> list migration history
#   alembic current                                    -> show current DB revision

[alembic]
# Path to the migrations directory
script_location = migrations

# Python file template for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used when generating migration file timestamps
timezone = UTC

# Maximum length of migration "slug" (short description) in filename
truncate_slug_length = 40

# --- DATABASE URL ---
# This is overridden in migrations/env.py to use the value from app.config.settings
# so we can keep a single source of truth. This value is only used as a fallback
# when running alembic directly without the application context.
sqlalchemy.url = postgresql+asyncpg://finpulse:finpulse_secret@localhost:5434/finpulse_db

# Logging configuration (applies ONLY to the alembic command-line tool)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
